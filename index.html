<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Benício · Consultor de Benefícios Flex</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#EA1D2C;--red-bg:#fff2f2;--red-bd:#fca5a5;
  --green:#16a34a;--green-bg:#f0fdf4;--green-t:#14532d;--green-bd:#86efac;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-t:#1e3a8a;--blue-bd:#93c5fd;
  --orange:#ea580c;--orange-bg:#fff7ed;--orange-t:#7c2d12;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --yel-bg:#fffbe6;--yel-t:#7a6200;
  --bg:#f0efeb;--surf:#fff;--surf2:#f6f5f1;--surf3:#eeede9;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.16);
  --tx:#1a1a1a;--tx2:#5c5c5c;--tx3:#9a9a9a;
  --r:8px;--rl:18px;--rxl:24px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 5rem}
.wrap{width:100%;max-width:640px;margin-bottom:1.25rem}
.hero{background:var(--red);border-radius:var(--rxl);display:flex;align-items:flex-end;overflow:hidden;padding:1.5rem 0 0 1.75rem;min-height:128px}
.hero-txt{flex:1;padding-bottom:1.5rem}
.hero-badge{font-size:11px;font-weight:600;background:rgba(255,255,255,.2);color:#fff;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
.hero-txt h1{font-size:20px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:4px}
.hero-txt p{font-size:13px;color:rgba(255,255,255,.82);line-height:1.5;max-width:320px}
.hero-img{width:155px;flex-shrink:0;display:flex;align-items:flex-end}
.hero-img img{width:155px;height:auto;display:block;filter:drop-shadow(0 4px 16px rgba(0,0,0,.2))}
.chat{width:100%;max-width:640px;background:var(--surf);border-radius:var(--rxl);border:1px solid var(--bd);overflow:hidden}
#msgs{padding:1.5rem;display:flex;flex-direction:column;gap:14px;min-height:190px}
.msg{display:flex;gap:10px;align-items:flex-end}
.msg.u{flex-direction:row-reverse}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--red)}
.av img{width:40px;height:40px;object-fit:cover;object-position:40% 10%}
.av.me{background:var(--surf2);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center}
.av.me i{font-size:18px;color:var(--tx2)}
.bbl{max-width:80%;padding:.75rem 1rem;font-size:14px;line-height:1.7;color:var(--tx)}
.msg.bot .bbl{background:var(--surf2);border:1px solid var(--bd);border-radius:4px 14px 14px 14px}
.msg.u .bbl{background:var(--red);color:#fff;border-radius:14px 4px 14px 14px}
.opt-panel{border-top:1px solid var(--bd);padding:1rem 1.5rem;background:var(--surf2)}
.opt-lbl{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 16px;border:1px solid var(--bd2);border-radius:22px;background:var(--surf);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.opt:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.inp-row{border-top:1px solid var(--bd);padding:1rem 1.5rem;display:flex;gap:8px;align-items:center;background:var(--surf2)}
.inp-row input{flex:1;border:1px solid var(--bd2);border-radius:22px;padding:10px 16px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--surf);color:var(--tx);outline:none}
.inp-row input:focus{border-color:var(--red)}
.send{width:40px;height:40px;border-radius:50%;background:var(--red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send i{font-size:17px;color:#fff}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#bbb;margin:0 2px;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.fi{animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.rw{width:100%;max-width:640px;margin-top:1.25rem;display:flex;flex-direction:column;gap:14px}
.sticky{position:sticky;top:8px;z-index:100;background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 16px rgba(0,0,0,.1)}
.s-lbl{font-size:12px;color:var(--tx2)}
.s-pts{font-size:20px;font-weight:600;color:var(--green);line-height:1;transition:color .2s}
.s-pts.over{color:var(--red)}.s-pts.zero{color:var(--tx3)}
.s-grid{display:flex;gap:16px}
.s-item{text-align:center}
.s-val{font-size:14px;font-weight:600}
.s-sub{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rxl);overflow:hidden}
.ch{padding:1.25rem 1.5rem}
.ch h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.ch p{font-size:12px;color:rgba(255,255,255,.82)}
.cb{padding:1.25rem 1.5rem}
.st{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);margin:1.25rem 0 .75rem}
.st:first-child{margin-top:0}
.ib{border-radius:var(--r);padding:.875rem 1rem;font-size:13px;line-height:1.6;margin-bottom:.875rem}
.ib.g{background:var(--green-bg);color:var(--green-t);border:1px solid var(--green-bd)}
.ib.b{background:var(--blue-bg);color:var(--blue-t);border:1px solid var(--blue-bd)}
.ib.y{background:var(--yel-bg);color:var(--yel-t);border:1px solid #f0d800}
.ib.r{background:var(--red-bg);color:#991b1b;border:1px solid var(--red-bd)}
.pg{display:flex;flex-direction:column;gap:6px}
.pc{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .15s;user-select:none}
.pc:hover{border-color:var(--blue-bd);background:var(--blue-bg)}
.pc.sel{border-color:var(--blue);background:var(--blue-bg)}
.pc.top{border-color:var(--green-bd)}
.pc.top.sel{border-color:var(--green);background:var(--green-bg)}
.pr{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.pc.sel .pr{border-color:var(--blue);background:var(--blue)}
.pc.top.sel .pr{border-color:var(--green);background:var(--green)}
.prd{width:7px;height:7px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
.pc.sel .prd,.pc.top.sel .prd{opacity:1}
.pi{flex:1}
.pn{font-size:13px;font-weight:600}
.ps{font-size:11px;color:var(--tx3);margin-top:1px}
.pb{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.bdg.g{background:var(--green-bg);color:var(--green)}
.bdg.b{background:var(--blue-bg);color:var(--blue)}
.bdg.o{background:var(--orange-bg);color:var(--orange)}
.bdg.gr{background:var(--surf3);color:var(--tx2)}
.ppts{font-size:15px;font-weight:600;white-space:nowrap}
.smb{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--blue);font-weight:500;padding:8px 0;border:none;background:transparent;font-family:'DM Sans',sans-serif;margin-top:2px}
.smb i{transition:transform .25s;font-size:14px}
.smb.open i{transform:rotate(180deg)}
.smc{max-height:0;overflow:hidden;transition:max-height .35s ease}
.smc.open{max-height:1200px}
.dep-sec{margin-top:1.25rem;border-top:1px solid var(--bd);padding-top:1.25rem}
.dep-ctr{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.dep-lbl{flex:1;font-size:14px;font-weight:500}
.dep-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bd2);background:var(--surf);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);transition:all .15s;font-family:'DM Sans',sans-serif;line-height:1}
.dep-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.dep-n{font-size:22px;font-weight:600;min-width:28px;text-align:center}
.dep-row{background:var(--surf2);border:1px solid var(--bd);border-radius:var(--r);padding:.875rem 1rem;margin-bottom:6px}
.dep-row-t{font-size:13px;font-weight:600;margin-bottom:7px}
.dep-line{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--tx2)}
.dep-line strong{color:var(--tx)}
.dep-note{font-size:11px;padding:5px 9px;border-radius:6px;margin-top:6px;display:flex;align-items:center;gap:4px}
.dep-note.g{background:var(--green-bg);color:var(--green-t)}
.dep-note.y{background:var(--yel-bg);color:var(--yel-t)}
.va-disp{text-align:center;margin:.5rem 0 .75rem}
.va-val{font-size:32px;font-weight:600;color:var(--green)}
.va-lbl{font-size:12px;color:var(--tx3);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--green);cursor:pointer;height:6px}
.va-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px}
.va-pbar{height:7px;background:var(--surf3);border-radius:4px;overflow:hidden;margin-top:.875rem}
.va-pfill{height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.va-pinfo{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--tx3)}
.ob{border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:8px;transition:border-color .2s}
.ob.on{border-color:var(--green)}
.ob-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--surf);transition:background .15s}
.ob.on .ob-hd{background:var(--green-bg)}
.ob-tgl{width:40px;height:24px;border-radius:12px;background:var(--surf3);border:1.5px solid var(--bd2);position:relative;transition:all .2s;flex-shrink:0}
.ob-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:1px;left:1px;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ob.on .ob-tgl{background:var(--green);border-color:var(--green)}
.ob.on .ob-knob{left:18px}
.ob-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ob-ico i{font-size:18px}
.ob-ico.r{background:var(--red-bg)}.ob-ico.r i{color:var(--red)}
.ob-ico.b{background:var(--blue-bg)}.ob-ico.b i{color:var(--blue)}
.ob-ico.g{background:var(--green-bg)}.ob-ico.g i{color:var(--green)}
.ob-ico.o{background:var(--orange-bg)}.ob-ico.o i{color:var(--orange)}
.ob-ico.p{background:var(--purple-bg)}.ob-ico.p i{color:var(--purple)}
.ob-inf{flex:1;min-width:0}
.ob-nm{font-size:14px;font-weight:600}
.ob-sb{font-size:11px;color:var(--tx3);margin-top:1px}
.ob-rt{text-align:right;flex-shrink:0}
.ob-pts{font-size:14px;font-weight:600}
.ob-st{font-size:11px;color:var(--tx3)}
.ob-bd{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s}
.ob-bd.open{max-height:500px;padding:0 14px 14px}
.ob-desc{font-size:13px;color:var(--tx2);line-height:1.6;padding-top:10px}
.ob-pbar{height:5px;background:var(--surf3);border-radius:3px;overflow:hidden;margin-top:8px}
.ob-pfill{height:100%;border-radius:3px;background:var(--green)}
.ob-plbl{display:flex;justify-content:space-between;margin-top:3px;font-size:11px;color:var(--tx3)}
.ob-inp-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ob-inp-row label{font-size:12px;color:var(--tx2)}
.ob-inp{width:90px;border:1px solid var(--bd2);border-radius:var(--r);padding:6px 10px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--tx);background:var(--surf);outline:none}
.hob-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;cursor:pointer;font-size:13px;color:var(--tx3);border:1px dashed var(--bd2);border-radius:var(--r);margin-top:4px;transition:all .15s;background:transparent;font-family:'DM Sans',sans-serif;width:100%}
.hob-btn:hover{color:var(--blue);border-color:var(--blue-bd)}
.hob-wrap{max-height:0;overflow:hidden;transition:max-height .5s ease}
.hob-wrap.open{max-height:2000px}
.sum-t{width:100%;border-collapse:collapse}
.sum-t tr td{padding:7px 0;font-size:13px;border-bottom:1px solid var(--bd)}
.sum-t tr:last-child td{border-bottom:none;font-weight:600;font-size:14px;padding-top:12px}
.sum-t td:last-child{text-align:right;font-weight:500}
.pts-bar{height:10px;background:var(--surf3);border-radius:5px;overflow:hidden;margin:1rem 0 .5rem}
.pts-fill{height:100%;border-radius:5px;background:var(--green);transition:width .4s}
.pts-fill.over{background:var(--red)}
.pts-leg{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2)}
.reset-btn{width:100%;margin-top:1rem;padding:11px;border:1px solid var(--bd2);border-radius:var(--r);background:transparent;color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.reset-btn:hover{color:var(--red);border-color:var(--red)}
footer{margin-top:2.5rem;font-size:12px;color:var(--tx3);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-txt">
      <div class="hero-badge">iFood · Benefícios Flex</div>
      <h1>Oi! Eu sou o Benício 👋</h1>
      <p>Seu consultor de benefícios Flex. Vou montar o pacote ideal com base no seu perfil.</p>
    </div>
    <div class="hero-img"><img id="hImg" src="" alt="Benício"/></div>
  </div>
</div>
<div class="chat">
  <div id="msgs"></div>
  <div id="optp" style="display:none" class="opt-panel">
    <div class="opt-lbl">Escolha uma opção</div>
    <div class="opts" id="optg"></div>
  </div>
  <div id="inpr" style="display:none" class="inp-row">
    <input type="text" id="ti" placeholder="Digite aqui..."/>
    <button class="send" onclick="go()"><i class="ti ti-send"></i></button>
  </div>
</div>
<div class="rw" id="rw"></div>

function downgradeSavings() {
  var op = ST.p.op || 'bradesco';
  var peer = CH.peer; if(!peer) return 0;
  var defId = op === 'bradesco' ? peer.db : peer.du;
  var defPl = PS[op].filter(function(p){ return p.id === defId; })[0];
  var selPl = PS[op].filter(function(p){ return p.id === CH.sid; })[0];

  var diff = defPl.pts - selPl.pts;
  return diff > 0 ? diff : 0;
}

function $e(id){ return document.getElementById(id); }

function bav(){
  return '<div class="av"><img src="'+window._B+'" alt="Benício" style="object-position:40% 10%"/></div>';
}
function uav(){
  return '<div class="av me"><i class="ti ti-user"></i></div>';

function addBot(txt, typing){
  var w = document.createElement('div');
  w.className = 'msg bot fi';
  var inner = typing
    ? '<span class="dot"></span><span class="dot"></span><span class="dot"></span>'
    : txt.replace(/\n/g, '<br>');
  w.innerHTML = bav() + '<div class="bbl">' + inner + '</div>';
  $e('msgs').appendChild(w);
  $e('msgs').scrollTop = 9999;
  return w;
}
function addUser(txt){
  var w = document.createElement('div');
  w.className = 'msg u fi';
  w.innerHTML = '<div class="bbl">' + txt + '</div>' + uav();
  $e('msgs').appendChild(w);
  $e('msgs').scrollTop = 9999;
}
function showOpts(opts){
  $e('inpr').style.display = 'none';
  $e('optp').style.display = 'block';
  var g = $e('optg'); g.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt'; b.textContent = o.l;
    b.onclick = function(){ pickOpt(o); };
    g.appendChild(b);
  });
}
function showInp(ph){
  $e('optp').style.display = 'none';
  var r = $e('inpr'); r.style.display = 'flex';
  var i = $e('ti'); i.placeholder = ph; i.value = '';
  setTimeout(function(){ i.focus(); }, 80);
  i.onkeydown = function(e){ if(e.key === 'Enter') go(); };
}
function pickOpt(o){
  var st = STEPS[ST.step];
  addUser(o.l);
  ST.p[st.k] = o.v;
  $e('optp').style.display = 'none';
  nxt();
}
function go(){
  var i = $e('ti'), v = i.value.trim();
  if(!v) return;
  var st = STEPS[ST.step];
  addUser(v); ST.p[st.k] = v;
  $e('inpr').style.display = 'none';
  nxt();
}
function nxt(){
  ST.step++;
  if(ST.step >= STEPS.length){ setTimeout(render, 700); return; }
  var st = STEPS[ST.step];
  var txt = typeof st.bot === 'function' ? st.bot(ST.p) : st.bot;
  var tp = addBot('', true);
  setTimeout(function(){
    tp.remove();
    addBot(txt);
    setTimeout(function(){
      if(st.t === 'opts') showOpts(st.opts); else showInp(st.ph);
    }, 150);
  }, 650);
}

    + '<div class="ob-rt"><div class="ob-pts" id="op_'+o.id+'">'+pts+' pts</div><div class="ob-st" id="os_'+o.id+'">'+(isOn?'ativo':'desativado')+'</div></div>'
    + '</div>'
    + '<div class="ob-bd'+(isOn?' open':'')+'" id="ob_b_'+o.id+'">'
    + '<div class="ob-desc">'+o.desc+'</div>'
    + '<div class="ob-pbar"><div class="ob-pfill" style="width:'+Math.min(100,o.pct)+'%"></div></div>'
    + '<div class="ob-plbl"><span>Colegas do '+flex+' que usam</span><span>'+o.pct+'%</span></div>'
    + inp
    + '</div></div>';
}

function mkOpts(flex, peer, p, ie){
  if(ie) return '';
  var hf = p.casado || p.filhos > 0;
  var rec = {cultura:true, pet:p.pet, farm:p.filhos>0, reemb:hf, mob:false};

  var OBS = [
    {id:'cultura',ico:'ti-theater',col:'o',nm:'Cultura',sb:'Valor fixo R$50',
     desc:'Cinema, teatro, livros, shows. Valor fixo — não é possível mudar. '+peer.opt.cultura+'% dos colegas do '+flex+' ativam.',pct:peer.opt.cultura,fixo:true,min:50},
    {id:'pet',ico:'ti-paw',col:'g',nm:'Plano Pet (MeuPet)',sb:'Pets até 14 anos · 1 pt = R$1',
     desc:'Assistência veterinária para cães e gatos. Até 3 pets, permanência mínima de 1 ano.<br><br><strong>Até 7 anos:</strong> Emergencial 20 · Básico 40 · Plus 90 · Total 160 · Top 320 pts<br><strong>8–14 anos:</strong> De Boa 90 pts',pct:peer.opt.pet,fixo:false,min:20},
    {id:'farm',ico:'ti-pill',col:'b',nm:'Farmácia',sb:'Mín. 20 pts · 1 pt = R$1',
     desc:'Crédito para medicamentos. '+peer.opt.farm+'% dos colegas usam.'+(p.filhos>0?' Com filhos, faz muita diferença!':''),pct:peer.opt.farm,fixo:false,min:20},

    {id:'reemb',ico:'ti-receipt-refund',col:'g',nm:'Reembolso Flex',sb:'Mín. 10 pts · saldo acumulativo',
     desc:'Saldo que <strong>não expira</strong>. Aceito para: academia, cursos, medicamentos, ótica, vacinas, plano médico para pais, homeopatia e mais.'+(hf?'<br><strong>Com família, um dos benefícios de maior impacto!</strong>':''),pct:peer.opt.reemb,fixo:false,min:10},
    {id:'mob',ico:'ti-car',col:'o',nm:'Mobilidade (Combustível)',sb:'Mín. 20 pts · 1 pt = R$1',
     desc:'Cartão para combustível e transporte. '+peer.opt.mob+'% dos colegas do '+flex+' alocam.',pct:peer.opt.mob,fixo:false,min:20},

  ];

  var recObs = OBS.filter(function(o){ return rec[o.id]; });
  var hidObs = OBS.filter(function(o){ return !rec[o.id]; });

  var h = '<div class="card fi"><div class="ch" style="background:#1e40af"><h3><i class="ti ti-adjustments-horizontal"></i> Benefícios Opcionais</h3><p>Ative, desative e ajuste — o contador atualiza em tempo real</p></div><div class="cb">';
  h += '<div class="ib g" style="margin-bottom:1rem"><i class="ti ti-sparkles" style="margin-right:4px"></i> <strong>Recomendados para o seu perfil</strong> — já ativados para você avaliar</div>';
  recObs.forEach(function(o){ h += mkObRow(o, flex, CH.on[o.id]); });
  if(hidObs.length){
    h += '<button class="hob-btn" id="hobBtn" onclick="togHob()"><i class="ti ti-chevron-down"></i> Ver mais '+hidObs.length+' benefício(s) disponível(is)</button>';
    h += '<div class="hob-wrap" id="hobWrap"><div style="margin-top:8px">';
    hidObs.forEach(function(o){ h += mkObRow(o, flex, CH.on[o.id]); });
    h += '</div></div>';
  }
  return h + '</div></div>';
}

function mkSummary(){
  return '<div class="card fi"><div class="ch" style="background:#111827"><h3><i class="ti ti-calculator"></i> Resumo do Pacote</h3><p>Atualiza conforme você escolhe</p></div><div class="cb"><div id="sumC">calculando...</div><button class="reset-btn" onclick="rst()"><i class="ti ti-refresh"></i> Nova consulta com o Benício</button></div></div>';
}

// ── INTERACTIONS ──
function tsm(id, btnId){
  var el = $e(id), b = $e(btnId);
  if(!el || !b) return;
  el.classList.toggle('open'); b.classList.toggle('open');
}
function togHob(){
  var w = $e('hobWrap'), b = $e('hobBtn');
  if(!w || !b) return;
  w.classList.toggle('open');
  var op = w.classList.contains('open');
  b.innerHTML = '<i class="ti ' + (op ? 'ti-chevron-up' : 'ti-chevron-down') + '"></i> ' + (op ? 'Ocultar benefícios adicionais' : 'Ver mais benefícios disponíveis');
}
function selS(id){
  CH.sid = id;
  document.querySelectorAll('[data-sid]').forEach(function(el){
    el.classList.toggle('sel', el.dataset.sid === id);
  });
  updDepS(); updAll();
}
function selO(id){
  CH.oid = id;
  document.querySelectorAll('[data-oid]').forEach(function(el){
    el.classList.toggle('sel', el.dataset.oid === id);
  });
  updDepO(); updAll();
}
function chDep(t, d){
  if(t === 's'){
    CH.ds = Math.max(0, Math.min(5, CH.ds + d));
    var el = $e('dnS'); if(el) el.textContent = CH.ds;
    updDepS();
  } else {
    CH.do_ = Math.max(0, Math.min(5, CH.do_ + d));
    var el2 = $e('dnO'); if(el2) el2.textContent = CH.do_;
    updDepO();
  }
  updAll();
}
function updDepS(){
  var el = $e('ddS'); if(!el) return;
  if(CH.ds === 0){ el.innerHTML = ''; return; }
  var op = ST.p.op || 'bradesco';
  var pl = PS[op].filter(function(p){ return p.id === CH.sid; })[0];
  if(!pl){ el.innerHTML = ''; return; }
  var bonus = downgradeSavings();
  var r = '';
  // Show downgrade bonus alert if applicable and there are subsidized deps
  if(bonus > 0 && CH.ds > 1){
    r += '<div class="ib g" style="margin-bottom:8px"><i class="ti ti-gift" style="margin-right:4px"></i>'
      + '<strong>+'+bonus+' pts bônus por dependente!</strong> Você escolheu um plano '+bonus+' pts mais barato que o padrão — '
      + 'esses pontos ficam disponíveis em cada dependente subsidiado.</div>';
  }
  for(var i = 0; i < CH.ds; i++){
    var sub = subsidy(CH.flex, i) > 0;
    var subPts = sub ? subsidy(CH.flex, i) + bonus : 0;
    var ptsDesc = sub ? '0 pts (iFood subsidia)' : pl.pts+' pts';
    var noteText = sub
      ? '✅ 2º+ dependente: iFood subsidia 100%'+(bonus > 0 ? ' + '+bonus+' pts bônus do downgrade' : '')
      : '⚠ 1º dependente: pago em pontos ou desconto em folha';
    r += '<div class="dep-row"><div class="dep-row-t">'+(i+1)+'º dependente — '+pl.n+'</div>'
      + '<div class="dep-line"><span>Pontos descontados</span><strong>'+ptsDesc+'</strong></div>'
      + (sub && bonus > 0 ? '<div class="dep-line"><span>Pontos subsidio iFood</span><strong>'+subPts+' pts</strong></div>' : '')
      + '<div class="dep-note '+(sub?'g':'y')+'">'+noteText+'</div></div>';
  }
  el.innerHTML = r;
}
function updDepO(){
  var el = $e('ddO'); if(!el) return;
  if(CH.do_ === 0){ el.innerHTML = ''; return; }
  var pl = PO.filter(function(p){ return p.id === CH.oid; })[0];
  if(!pl){ el.innerHTML = ''; return; }
  var r = '';
  for(var i = 0; i < CH.do_; i++){
    r += '<div class="dep-row"><div class="dep-row-t">'+(i+1)+'º dependente — '+pl.n+'</div>'
      + '<div class="dep-line"><span>Pontos descontados</span><strong>'+pl.pts+' pts</strong></div></div>';
  }
  el.innerHTML = r;
}
function onVa(val){
  val = parseInt(val); CH.va = val;
  var d = $e('vaV'); if(d) d.textContent = 'R$ ' + val;
  var peer = CH.peer; if(!peer) return;
  var vmin = 810, vmax = CH.total;
  var pf = Math.min(100, Math.round(((peer.vm - vmin) / (vmax - vmin)) * 100));
  var f = $e('vaPF'); if(f) f.style.width = pf + '%';
  var ct = $e('vaCT');
  if(ct) ct.textContent = val > peer.vm ? '▲ acima da mediana' : val < peer.vm ? '▼ abaixo da mediana' : '= na mediana';
  var lbl = $e('vaL');
  if(lbl) lbl.textContent = val === 810 ? 'mínimo obrigatório' : val > peer.vm ? 'acima da mediana dos colegas' : 'por mês';
  updAll();
}
function togOb(id){
  CH.on[id] = !CH.on[id];
  var el = $e('ob_' + id); if(!el) return;
  el.classList.toggle('on', CH.on[id]);
  var bd = $e('ob_b_' + id); if(bd) bd.classList.toggle('open', CH.on[id]);
  var st = $e('os_' + id); if(st) st.textContent = CH.on[id] ? 'ativo' : 'desativado';
  updAll();
}
function onOpts(id, val){
  val = Math.max(10, parseInt(val) || 10); CH.pts[id] = val;
  var r = $e('or_' + id); if(r) r.textContent = val;
  updAll();
}

// ── COMPUTE ──
function calc(){
  var op = ST.p.op || 'bradesco';
  var pl = PS[op].filter(function(p){ return p.id === CH.sid; })[0] || PS[op][0];
  var od = PO.filter(function(p){ return p.id === CH.oid; })[0] || PO[0];
  var ds = 0;
  for(var i = 0; i < CH.ds; i++){ if(subsidy(CH.flex, i) === 0) ds += pl.pts; }
  var do_ = CH.do_ * od.pts;
  var op_ = 0;
  Object.keys(CH.on).forEach(function(k){ if(CH.on[k]) op_ += CH.pts[k] || 0; });
  var alloc = (pl.pts - 279) + (od.pts - 12) + (CH.va - 810) + ds + do_ + op_;
  return {pl:pl, od:od, ds:ds, do_:do_, op_:op_, alloc:alloc, rest:CH.livre - alloc};
}
function updAll(){
  var c = calc();
  var sp = $e('stkPts');
  if(sp){ sp.textContent = c.rest + ' pts'; sp.className = 's-pts' + (c.rest < 0 ? ' over' : c.rest === 0 ? ' zero' : ''); }
  var mt = $e('stkTotal'); if(mt) mt.textContent = CH.total + ' pts';
  var mu = $e('stkUsed'); if(mu) mu.textContent = (279 + 12 + 810 + c.alloc) + ' pts';
  var mf = $e('stkFree'); if(mf){ mf.textContent = c.rest + ' pts'; mf.style.color = c.rest < 0 ? 'var(--red)' : 'var(--green)'; }
  updSum(c);
}
function updSum(c){
  var el = $e('sumC'); if(!el) return;
  var over = c.rest < 0;
  var pct = Math.min(100, Math.round((c.alloc / CH.livre) * 100));
  var onms = {cultura:'Cultura',pet:'Plano Pet',farm:'Farmácia',reemb:'Reembolso Flex',mob:'Mobilidade'};
  var orows = '';
  Object.keys(CH.on).forEach(function(k){ if(CH.on[k]) orows += '<tr><td>'+onms[k]+'</td><td>'+CH.pts[k]+' pts</td></tr>'; });
  el.innerHTML =
    '<div class="st">Compulsórios</div>'
    + '<table class="sum-t">'
    + '<tr><td>Saúde · '+c.pl.n+'</td><td>'+c.pl.pts+' pts</td></tr>'
    + (CH.ds > 0 ? '<tr><td style="color:var(--tx3);font-size:12px"> ↳ '+CH.ds+' dep(s)</td><td style="font-size:12px">'+c.ds+' pts</td></tr>' : '')
    + '<tr><td>Odonto · '+c.od.n+'</td><td>'+c.od.pts+' pts</td></tr>'
    + (CH.do_ > 0 ? '<tr><td style="color:var(--tx3);font-size:12px"> ↳ '+CH.do_+' dep(s)</td><td style="font-size:12px">'+c.do_+' pts</td></tr>' : '')
    + '<tr><td>Seguro de Vida (25×)</td><td style="color:var(--green)">iFood paga ✓</td></tr>'
    + '<tr><td>Vale Alimentação</td><td>'+CH.va+' pts</td></tr>'
    + '</table>'
    + (orows ? '<div class="st">Opcionais ativados</div><table class="sum-t">'+orows+'</table>' : '')
    + '<div class="st">Uso dos pontos livres ('+CH.livre+' pts)</div>'
    + '<div class="pts-bar"><div class="pts-fill' + (over ? ' over' : '') + '" style="width:'+pct+'%"></div></div>'
    + '<div class="pts-leg"><span>Alocados: <strong>'+c.alloc+' pts</strong></span><span>Livres: <strong>'+CH.livre+' pts</strong></span></div>'
    + '<table class="sum-t" style="margin-top:1rem">'
    + '<tr><td>Saldo restante</td><td style="color:'+(over?'var(--red)':'var(--green)')+'">'+c.rest+' pts'+(over?' ⚠':'')+'</td></tr>'
    + '</table>'
    + (over
        ? '<div class="ib r" style="margin-top:.75rem">⚠ Pontos excedidos! Reduza benefícios ou escolha planos mais econômicos.</div>'
        : c.rest > 0
          ? '<div class="ib y" style="margin-top:.75rem">💡 Você ainda tem <strong>'+c.rest+' pts livres</strong>. Se não alocados, vão para <strong>Vale Alimentação</strong>.</div>'
          : '<div class="ib g" style="margin-top:.75rem">✅ Pacote completo! Todos os pontos livres estão alocados.</div>');
}

// ── RESET ──
function rst(){
  ST = {step:0, p:{nome:'',grade:null,op:'bradesco',casado:false,filhos:0,pet:false,cidade:''}};
  CH = {flex:null,livre:0,total:0,peer:null,sid:null,oid:'eplus',ds:0,do_:0,va:810,
    on:{cultura:false,pet:false,farm:false,mob:false,reemb:false},
    pts:{cultura:50,pet:90,farm:50,mob:50,reemb:100}};
  $e('msgs').innerHTML = ''; $e('optp').style.display = 'none'; $e('inpr').style.display = 'none'; $e('rw').innerHTML = '';
  init();
}

// ── INIT ──
function init(){
  var st = STEPS[0], tp = addBot('', true);
  setTimeout(function(){
    tp.remove(); addBot(st.bot);
    setTimeout(function(){ showInp(st.ph); }, 150);
  }, 600);
}
init();
</script>
</body>
</html>
